name: CI

on: 
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main
      - dev

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v4
        with: 
          node-version: 24
      
      - name: install dependencies
        run: npm ci   

      - name: run Eslint
        run: npm run lint

  test:
    name: unit test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: setup nodejs
        uses: actions/setup-node@v4
        with: 
          node-version: 24
      
      - name: install dependencies
        run: npm ci

      - name: run unit test
        run: npm run test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: setup nodejs
        uses: actions/setup-node@v4
        with: 
          node-version: 24
      
      - name: install dependencies
        run: npm ci

      - name: build
        run: npm run build
